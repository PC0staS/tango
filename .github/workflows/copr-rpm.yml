name: COPR RPM + Homebrew

on:
  push:
    tags:
      - "v*"

jobs:
  copr:
    runs-on: ubuntu-latest
    container:
      image: fedora:latest
      options: --user root

    steps:
      - name: Install dependencies
        run: dnf install -y copr-cli rpm-build git golang

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fix git ownership
        run: git config --global --add safe.directory "$PWD"

      - name: Setup COPR config
        run: |
          mkdir -p ~/.config
          cat > ~/.config/copr << EOF
          [copr-cli]
          login = ${{ secrets.COPR_LOGIN }}
          username = ${{ secrets.COPR_USERNAME }}
          token = ${{ secrets.COPR_TOKEN }}
          copr_url = https://copr.fedorainfracloud.org
          EOF

      - name: Build SRPM and submit to COPR
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          go mod vendor
          tar -czf tango-${VERSION}.tar.gz --transform "s,^,tango-${VERSION}/," * .gitignore
          rpmbuild -bs tango.spec \
            --define "_sourcedir $PWD" \
            --define "_srcrpmdir $PWD" \
            --define "version ${VERSION}"
          copr-cli build tango *.src.rpm --nowait

  homebrew:
    runs-on: ubuntu-latest
    needs: copr

    steps:
      - uses: actions/checkout@v4
        with:
          repository: pc0stas/homebrew-tango
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}

      - name: Update formula
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          SHA=$(curl -sL https://github.com/pc0stas/tango/archive/v${VERSION}.tar.gz | sha256sum | awk '{print $1}')
          sed -i "s|url .*|url \"https://github.com/pc0stas/tango/archive/v${VERSION}.tar.gz\"|" Formula/tango.rb
          sed -i "s|sha256 .*|sha256 \"${SHA}\"|" Formula/tango.rb
          sed -i "s|version .*|version \"${VERSION}\"|" Formula/tango.rb

      - name: Commit and push
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add Formula/tango.rb
          git commit -m "tango ${VERSION}" || echo "No changes to commit"
          git push
